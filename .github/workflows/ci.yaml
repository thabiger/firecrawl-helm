name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: helm lint . --values ci/test-values.yaml
      - run: helm template firecrawl . -n firecrawl --values ci/test-values.yaml >/dev/null
      - run: python -m unittest discover -s tests -v
      - run: scripts/check-generic.sh
