name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm package . --destination dist
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: helm push dist/firecrawl-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
