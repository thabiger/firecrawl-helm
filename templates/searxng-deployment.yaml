{{- if .Values.searxng.enabled }}
{{- $name := include "firecrawl.componentName" (dict "ctx" . "component" "searxng") -}}
{{- $secretName := include "firecrawl.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecrawl.labels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
spec:
  replicas: {{ .Values.searxng.replicaCount }}
  selector:
    matchLabels:
      {{- include "firecrawl.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: searxng
  template:
    metadata:
      labels:
        {{- include "firecrawl.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: searxng
        {{- with .Values.searxng.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.searxng.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.searxng.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: searxng
          image: {{ include "firecrawl.image" .Values.images.searxng | quote }}
          imagePullPolicy: {{ .Values.images.searxng.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.searxng.port }}
          env:
            - name: SEARXNG_BASE_URL
              value: {{ printf "http://%s:%v/" $name .Values.service.searxng.port | quote }}
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: SEARXNG_SECRET
            {{- with .Values.searxng.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.searxng.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: settings
          configMap:
            name: {{ $name }}-config
        - name: cache
          emptyDir: {}
      {{- with .Values.searxng.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.searxng.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.searxng.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
