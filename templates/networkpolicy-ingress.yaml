{{- if .Values.networkPolicy.enabled }}
{{- $ingress := .Values.networkPolicy.ingress -}}
{{- $hasRules := or $ingress.allowSameRelease (gt (len ($ingress.allowFrom | default list)) 0) -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "firecrawl.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecrawl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "firecrawl.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if $hasRules }}
  ingress:
    {{- if $ingress.allowSameRelease }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "firecrawl.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- range $ingress.allowFrom }}
    - from:
        {{- toYaml (list .) | nindent 8 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
