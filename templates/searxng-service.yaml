{{- if .Values.searxng.enabled }}
{{- $name := include "firecrawl.componentName" (dict "ctx" . "component" "searxng") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecrawl.labels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
spec:
  type: {{ .Values.service.searxng.type }}
  selector:
    {{- include "firecrawl.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
  ports:
    - name: http
      port: {{ .Values.service.searxng.port }}
      targetPort: http
{{- end }}
