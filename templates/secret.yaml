{{- if not .Values.existingSecret }}
{{- $secretName := printf "%s-secrets" (include "firecrawl.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = $existing.data | default dict -}}
{{- end -}}
{{- $postgresUser := .Values.secret.postgresUser -}}
{{- if not $postgresUser -}}
{{- if hasKey $existingData "POSTGRES_USER" -}}
{{- $postgresUser = index $existingData "POSTGRES_USER" | b64dec -}}
{{- else -}}
{{- $postgresUser = "postgres" -}}
{{- end -}}
{{- end -}}
{{- $postgresDb := .Values.secret.postgresDb -}}
{{- if not $postgresDb -}}
{{- if hasKey $existingData "POSTGRES_DB" -}}
{{- $postgresDb = index $existingData "POSTGRES_DB" | b64dec -}}
{{- else -}}
{{- $postgresDb = "postgres" -}}
{{- end -}}
{{- end -}}
{{- $postgresPassword := .Values.secret.postgresPassword -}}
{{- if not $postgresPassword -}}
{{- if hasKey $existingData "POSTGRES_PASSWORD" -}}
{{- $postgresPassword = index $existingData "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $postgresPassword = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $searxngSecret := .Values.secret.searxngSecret -}}
{{- if not $searxngSecret -}}
{{- if hasKey $existingData "SEARXNG_SECRET" -}}
{{- $searxngSecret = index $existingData "SEARXNG_SECRET" | b64dec -}}
{{- else -}}
{{- $searxngSecret = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $bullAuthKey := .Values.secret.bullAuthKey -}}
{{- if not $bullAuthKey -}}
{{- if hasKey $existingData "BULL_AUTH_KEY" -}}
{{- $bullAuthKey = index $existingData "BULL_AUTH_KEY" | b64dec -}}
{{- else -}}
{{- $bullAuthKey = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecrawl.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $postgresUser | quote }}
  POSTGRES_DB: {{ $postgresDb | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  SEARXNG_SECRET: {{ $searxngSecret | quote }}
  BULL_AUTH_KEY: {{ $bullAuthKey | quote }}
{{- end }}
